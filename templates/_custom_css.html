<style>

  /* light mode colors */
  body {
    --primary-color: #5871a2;
    --primary-pale-color: #5871a233;
    --primary-decoration-color: #5871a210;
    --bg-color: #ffffff;
    --text-color: #2f3030;
    --text-pale-color: #767676;
    --text-decoration-color: #a9a9a9;
    --highlight-mark-color: #5f75b020;

    --callout-note-color: #5871a2;
    --callout-tip-color: #268556;
    --callout-important-color: #885fc9;
    --callout-warning-color: #ab6632;
    --callout-caution-color: #c64e4e;
  }

  /* dark mode colors */
  body.dark {
    --primary-color: #6f8fd1;
    --primary-pale-color: #6f8fd166;
    --primary-decoration-color: #6f8fd112;
    --bg-color: #1c1c1c;
    --text-color: #c1c1c1;
    --text-pale-color: #848484;
    --text-decoration-color: #5f5f5f;
    --highlight-mark-color: #8296cb3b;

    --callout-note-color: #6f8fd1;
    --callout-tip-color: #47976f;
    --callout-important-color: #9776cd;
    --callout-warning-color: #ad7a52;
    --callout-caution-color: #d06161;
  }

  /* typography */
  body {
    --main-font: ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
    --code-font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    --homepage-max-width: 768px;
    --main-max-width: 768px;
    --avatar-size: 60px;
    --font-size: 16px;
    --line-height: 1.75;
    --img-border-radius: 0px;
    --detail-border-radius: 0px;
    --dark-mode-img-brightness: 0.75;
    --dark-mode-chart-brightness: 0.75;
    --inline-code-border-radius: 2px;
    --inline-code-bg-color: var(--primary-decoration-color);
    --block-code-border-radius: 0px;
    --block-code-border-color: var(--primary-color);
    --detail-border-color: var(--primary-color);
  }

  /* photo gallery (no-JS grid; thumbnails link to full image) */
  .prose .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 0.75rem;
    margin: 1.5rem 0;
  }
  .prose .gallery figure { margin: 0; }
  .prose .gallery a { display: block; line-height: 0; }
  .prose .gallery img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
  }
  .prose .gallery figcaption {
    font-size: 0.8rem;
    line-height: 1.4;
    color: var(--text-pale-color);
    margin-top: 0.35rem;
  }

  /* NOTE: the theme includes this file *before* main.css, so any rule that fights
     a theme rule needs to out-specify it — hence the `html` prefixes below. */

  /* homepage: no avatar/name/bio band above the menu — the name is an h1 in the text */
  html body.homepage #info { display: none; }

  /* the theme centres the homepage vertically (min-height 100vh/75vh + 4em padding),
     which assumes a three-line bio — with this much text it only pushes the menu
     far down the page. Start at the top instead. */
  html body.homepage #wrapper {
    min-height: 0;
    justify-content: flex-start;
  }
  html body.homepage main {
    min-height: 0;
    padding: 2em 0 3em;
  }

  html body.homepage #links {
    margin: 1em 0 2.5em;
  }

  /* "::" between the site sections and the posts. The 4th entry is the first
     post — see config.extra.sections. Absolutely positioned on the homepage so
     the link's underline does not run under it. */
  #links #left a:nth-of-type(4) {
    position: relative;
    margin-left: 1.5em;
  }
  #links #left a:nth-of-type(4)::before {
    content: "::";
    position: absolute;
    left: -1.55em;
    color: var(--text-pale-color);
  }

  /* inner-page nav: back link on the left, menu on the right (see macros/prose.html) */
  header nav {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0 1em;
  }
  header nav .nav-menu {
    display: flex;
    flex-wrap: wrap;
  }
  /* the 1em gap left of the separator comes from the previous link's padding, so
     match it on the right to keep "::" centred between "cv" and "adventure 9" */
  header nav .nav-menu a:nth-of-type(4)::before {
    content: "::";
    margin-right: 1em;
    color: var(--text-decoration-color);
  }
  header nav .nav-menu a:last-child {
    padding-right: 0;
  }

  #brief h1 {
    font-size: 1.9em;
    margin: 0 0 0.75em;
  }

  /* the theme's heading rhythm (3em above an h2, 2.5em above an h3) is meant for
     long prose; on heading-heavy pages like /teaching it is mostly empty screen */
  html .prose h2 {
    margin: 2em 0 0.75em;
  }
  html .prose h3,
  html .prose h4,
  html .prose h5,
  html .prose h6 {
    margin: 1.5em 0 0.5em;
  }
  html .prose h2 + h3 {
    margin-top: 0.75em;
  }

  /* homepage intro photo — floats beside the name and bio, like the old site */
  .prose img.home-photo {
    float: right;
    width: 38%;
    margin: 0.3rem 0 1rem 1.5rem;
    border-radius: var(--img-border-radius);
  }
  @media (max-width: 640px) {
    .prose img.home-photo {
      float: none;
      display: block;
      width: 70%;
      margin: 0 auto 1.25rem;
    }
  }

  /* partner logos row */
  .prose .partners {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1.25rem;
    margin: 1rem 0;
  }
  .prose .partners img {
    height: 40px;
    width: auto;
    background: #fff;
    padding: 8px 12px;
    border-radius: 4px;
  }

</style>
